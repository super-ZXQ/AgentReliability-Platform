[project]
name = "agentreliability"
version = "0.1.0"
description = "面向工具型 AI Agent 的自动化测试与回归门禁"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.11",
    "sqlglot==30.17.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
]

[project.scripts]
agentreliability = "agentreliability.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentreliability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
